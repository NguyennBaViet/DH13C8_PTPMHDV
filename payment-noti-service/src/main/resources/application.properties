spring.application.name=payment-noti-service
server.port=8025

# ── Database ──────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/khachsan?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ───────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ── JWT ───────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:dh13c8-khachsan-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256}

# ── Internal Service URLs ─────────────────────────────────
app.booking-service.url=${BOOKING_SERVICE_URL:http://localhost:8024}

# ── Mail (SMTP) ───────────────────────────────────────────
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:dh13c8.khachsan@gmail.com}
spring.mail.password=${MAIL_PASSWORD:app-password-placeholder}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:dh13c8.khachsan@gmail.com}
# Khi true, nếu gửi mail thất bại (do chưa có SMTP thật hoặc lỗi mạng) thì chỉ log cảnh báo, không làm gián đoạn thanh toán
app.mail.allow-mock-fallback=true

# ── Stripe Sandbox ────────────────────────────────────────
stripe.api-key=${STRIPE_API_KEY:sk_test_51MockStripeSecretKeyForDH13C8HotelBookingSystem}
stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:pk_test_51MockStripePublicKey}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:whsec_mock}
stripe.currency=vnd

# ── Logging ───────────────────────────────────────────────
logging.level.dh13c8=DEBUG

# ── Tắt generated security password ──────────────────────
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
