spring.application.name=user-service
server.port=8022

# ── Database ──────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/khachsan?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA ───────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ── JWT (cùng secret với auth-service để validate) ────────
app.jwt.secret=dh13c8-khachsan-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256

# ── Logging ───────────────────────────────────────────────
logging.level.dh13c8=DEBUG
