spring.application.name=booking-service
server.port=8024

# ── Database ──────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/khachsan?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA ───────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ── Tắt generated security password ──────────────────────
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# ── Booking config ────────────────────────────────────────
booking.lock-timeout-minutes=15
booking.tax-rate=0.10
booking.cancel-free-before-hours=24

# ── JWT ───────────────────────────────────────────────────
app.jwt.secret=dh13c8-khachsan-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256

# ── Internal service URLs ─────────────────────────────────
app.hotel-room-service.url=http://localhost:8023
app.payment-service.url=http://localhost:8025

# ── Logging ───────────────────────────────────────────────
logging.level.dh13c8=DEBUG
