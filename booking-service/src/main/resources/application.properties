spring.application.name=booking-service
server.port=8024

# ── Database ──────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/khachsan?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA ───────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ── JWT ───────────────────────────────────────────────────
app.jwt.secret=dh13c8-khachsan-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256

# ── Internal service URLs ─────────────────────────────────
app.hotel-room-service.url=http://localhost:8023

# ── Logging ───────────────────────────────────────────────
logging.level.dh13c8=DEBUG
